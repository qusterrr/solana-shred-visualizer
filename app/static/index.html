<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Solana Shred Visualizer</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

    <script
        src="https://cdn.plot.ly/plotly-2.35.2.min.js"
    ></script>
</head>

<body>

<main class="app">

    <header class="topbar">

        <div>
            <h1>Solana Shred Visualizer</h1>

            <p>
                Turbine shred arrival monitor
            </p>
        </div>

        <div
            id="connection-status"
            class="connection-status"
        >
            CONNECTING
        </div>

    </header>


    <section class="toolbar">

        <div class="control">

            <label for="slot-select">
                SLOT
            </label>

            <select id="slot-select">
            </select>

        </div>


        <div class="control">

            <label for="auto-mode">
                FOLLOW
            </label>

            <select id="auto-mode">

                <option
                    value="live"
                    selected
                >
                    Live current
                </option>

                <option value="previous">
                    Previous slot
                </option>

                <option value="off">
                    Off
                </option>

            </select>

        </div>


        <div class="control">

            <label>
                VIEW
            </label>

            <div class="button-group">

                <button
                    id="cdf-button"
                    class="view-button active"
                    type="button"
                >
                    CDF
                </button>

                <button
                    id="timeline-button"
                    class="view-button"
                    type="button"
                >
                    Timeline
                </button>

                <button
                    id="density-button"
                    class="view-button"
                    type="button"
                >
                    Density
                </button>

            </div>

        </div>


        <div class="control">

            <label>
                HISTORY
            </label>

            <div class="button-group">

                <button
                    id="older-button"
                    type="button"
                >
                    ← Older
                </button>

                <button
                    id="newer-button"
                    type="button"
                >
                    Newer →
                </button>

            </div>

        </div>


        <div class="control">

            <label for="go-slot-input">
                GO TO SLOT
            </label>

            <div class="go-to-slot">

                <input
                    id="go-slot-input"
                    type="number"
                    min="0"
                    placeholder="Slot number"
                >

                <button
                    id="go-slot-button"
                    type="button"
                >
                    Go
                </button>

            </div>

        </div>


        <button
            id="refresh-button"
            class="refresh-button"
            type="button"
        >
            Refresh
        </button>

    </section>


    <section class="slot-info">

        <strong id="slot-title">
            Slot –
        </strong>

        <span id="slot-summary">
            No data
        </span>

    </section>


    <div
        id="view-help"
        class="view-help"
    ></div>


    <section class="visualization">

        <div id="chart"></div>

    </section>


    <footer class="legend">

        <span>
            <i class="data-dot"></i>
            Data shred
        </span>

        <span>
            <i class="code-dot"></i>
            Coding shred
        </span>

        <span>
            ◇ FEC decodable
        </span>

        <span>
            <i class="limit-line"></i>
            200 ms slot reference
        </span>

    </footer>

</main>

<script src="/app.js"></script>

</body>
</html>
